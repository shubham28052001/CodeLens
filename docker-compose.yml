services:
  postgres:
    image: postgres:17
    container_name: codelens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codelens
      POSTGRES_PASSWORD: CodeLensDB123
      POSTGRES_DB: codelens
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: